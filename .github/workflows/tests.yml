name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt httpx websockets
      - name: Syntax and frontend checks
        run: |
          python -m py_compile app/*.py tests/*.py
          node --check app/static/app.js
      - name: Phase 2 suite
        run: python tests/run_phase2_checks.py
      - name: Phase 3 suite
        run: python tests/run_phase3_checks.py
      - name: Audit fixes suite
        run: python tests/run_audit_fixes_checks.py
      - name: Phase 3 completion suite
        run: python tests/run_phase3_completion_checks.py
      - name: Build Docker image
        run: docker build -t nirapodnet:test .